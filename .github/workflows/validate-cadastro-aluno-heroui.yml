name: Validate Cadastro Aluno HeroUI

on:
  pull_request:
    paths:
      - "projects/cadastro-aluno-factory-heroui/**"
      - ".github/workflows/validate-cadastro-aluno-heroui.yml"
  push:
    branches: ["main"]
    paths:
      - "projects/cadastro-aluno-factory-heroui/**"
      - ".github/workflows/validate-cadastro-aluno-heroui.yml"

# Temporary write permission for the field-test migration only. The workflow
# reverts to contents: read after the generated lockfile is committed.
permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Use project npm version
        run: npm install --global npm@11.5.2

      - name: Validate semantic specification
        env:
          PYTHONPATH: .
        run: |
          python scripts/factory.py --root projects/cadastro-aluno-factory-heroui spec-validate
          python scripts/semantic_assurance.py --root projects/cadastro-aluno-factory-heroui analyze
          python - <<'PY'
          from engine.semantic_verification import validate_verification_plan
          errors = validate_verification_plan("projects/cadastro-aluno-factory-heroui")
          if errors:
              raise SystemExit("\n".join(errors))
          print("OK: semantic verification plan valid")
          PY

      - name: Materialize lockfile and install dependencies
        working-directory: projects/cadastro-aluno-factory-heroui
        run: npm install

      - name: Lint, typecheck, unit tests and build
        working-directory: projects/cadastro-aluno-factory-heroui
        run: npm run verify

      - name: Dependency audit
        working-directory: projects/cadastro-aluno-factory-heroui
        run: npm audit

      - name: Install Playwright Chromium
        working-directory: projects/cadastro-aluno-factory-heroui
        run: npx playwright install --with-deps chromium

      - name: Browser E2E
        working-directory: projects/cadastro-aluno-factory-heroui
        run: npm run e2e

      - name: Commit generated lockfile after green validation
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git add projects/cadastro-aluno-factory-heroui/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: commit student app lockfile"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
