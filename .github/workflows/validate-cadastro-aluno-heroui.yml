name: Validate Cadastro Aluno HeroUI

on:
  pull_request:
    paths:
      - "projects/cadastro-aluno-factory-heroui/**"
      - ".github/workflows/validate-cadastro-aluno-heroui.yml"
  push:
    branches: ["main"]
    paths:
      - "projects/cadastro-aluno-factory-heroui/**"
      - ".github/workflows/validate-cadastro-aluno-heroui.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Use project npm version
        run: npm install --global npm@11.5.2

      - name: Validate semantic specification
        env:
          PYTHONPATH: .
        run: |
          python scripts/factory.py --root projects/cadastro-aluno-factory-heroui spec-validate
          python scripts/semantic_assurance.py --root projects/cadastro-aluno-factory-heroui analyze
          python - <<'PY'
          from engine.semantic_verification import validate_verification_plan
          errors = validate_verification_plan("projects/cadastro-aluno-factory-heroui")
          if errors:
              raise SystemExit("\n".join(errors))
          print("OK: semantic verification plan valid")
          PY

      # Transitional field-test step: this project predates a lockfile. The
      # generated package-lock is exported as evidence, then committed before
      # final merge. Final CI must switch to npm ci.
      - name: Materialize lockfile and install dependencies
        working-directory: projects/cadastro-aluno-factory-heroui
        run: npm install

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: cadastro-aluno-lockfile
          path: projects/cadastro-aluno-factory-heroui/package-lock.json
          if-no-files-found: error

      - name: Lint, typecheck, unit tests and build
        working-directory: projects/cadastro-aluno-factory-heroui
        run: npm run verify

      - name: Dependency audit
        working-directory: projects/cadastro-aluno-factory-heroui
        run: npm audit --audit-level=high

      - name: Install Playwright Chromium
        working-directory: projects/cadastro-aluno-factory-heroui
        run: npx playwright install --with-deps chromium

      - name: Browser E2E
        working-directory: projects/cadastro-aluno-factory-heroui
        run: npm run e2e
