name: Validate Cadastro Aluno HeroUI

on:
  pull_request:
    paths:
      - "projects/cadastro-aluno-factory-heroui/**"
      - ".github/workflows/validate-cadastro-aluno-heroui.yml"
  push:
    branches: ["main"]
    paths:
      - "projects/cadastro-aluno-factory-heroui/**"
      - ".github/workflows/validate-cadastro-aluno-heroui.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: projects/cadastro-aluno-factory-heroui

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use project npm version
        run: npm install --global npm@11.5.2

      - name: Install dependencies
        run: npm install

      - name: Lint, typecheck, unit tests and build
        run: npm run verify

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser E2E
        run: npm run test:e2e
