name: Validate Living UI

on:
  pull_request:
    paths:
      - ".github/workflows/validate-living-ui.yml"
      - "examples/living-ui-admin/**"
      - "research/V0.8_LIVING_UI_VALIDATION.md"
      - "research/evidence/v0.8-living-ui-*.png"
      - "research/V1.0_FINAL_AUDIT.md"
      - "starters/web-admin/template/src/app/globals.css"
      - "starters/web-admin/template/src/components/motion/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-living-ui.yml"
      - "examples/living-ui-admin/**"
      - "research/V0.8_LIVING_UI_VALIDATION.md"
      - "research/evidence/v0.8-living-ui-*.png"
      - "research/V1.0_FINAL_AUDIT.md"
      - "starters/web-admin/template/src/app/globals.css"
      - "starters/web-admin/template/src/components/motion/**"

permissions:
  contents: read

env:
  CI: "true"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: examples/living-ui-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/living-ui-admin/package-lock.json
      - name: Use pinned npm version
        run: npm install --global npm@10.9.9 && npm --version
      - name: Install dependencies
        run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck without prior build artifacts
        run: npm run typecheck
      - name: Unit tests with coverage
        run: npm run test:coverage
      - name: Production build
        run: npm run build
      - name: Reject high or critical dependency advisories
        run: npm audit --audit-level=high
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end desktop, mobile and reduced motion
        run: npm run e2e
