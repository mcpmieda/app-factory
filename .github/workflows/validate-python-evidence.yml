name: Validate Python Evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned CI evidence tools
        run: python -m pip install --disable-pip-version-check -r requirements/ci-evidence.txt
      - name: Run Python evidence suite
        run: |
          coverage erase
          for suite in tests/v1_1 tests/v1_2 tests/v1_3 tests/v1_4 tests/semantic_assurance tests/agent_conformance tests/project_adoption tests/multiagent; do
            coverage run --parallel-mode -m unittest discover -s "$suite" -p 'test_*.py'
          done
          coverage run --parallel-mode scripts/validate_independent_verification.py
          coverage combine
          coverage report
