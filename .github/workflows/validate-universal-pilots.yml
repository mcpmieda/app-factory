name: Validate Universal Pilots

on:
  pull_request:
    paths:
      - ".github/workflows/validate-universal-pilots.yml"
      - "examples/website-pilot/**"
      - "examples/web-app-pilot/**"
      - "examples/chrome-extension-pilot/**"
      - "examples/automation-pilot/**"
      - "profiles/website/**"
      - "profiles/web-app/**"
      - "profiles/chrome-extension/**"
      - "profiles/automation/**"
      - "research/V0.9_UNIVERSAL_VALIDATION.md"
      - "research/V1.0_FINAL_AUDIT.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-universal-pilots.yml"
      - "examples/website-pilot/**"
      - "examples/web-app-pilot/**"
      - "examples/chrome-extension-pilot/**"
      - "examples/automation-pilot/**"
      - "research/V1.0_FINAL_AUDIT.md"

permissions:
  contents: read

env:
  CI: "true"

jobs:
  website:
    name: Website / Astro
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples/website-pilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/website-pilot/package-lock.json
      - run: npm install --global npm@11.12.1
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - name: Desktop, mobile, keyboard and reduced motion
        run: npm run test:e2e

  web-app:
    name: Web app / React
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples/web-app-pilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/web-app-pilot/package-lock.json
      - run: npm install --global npm@11.12.1
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - name: Full flow in desktop, mobile and reduced motion
        run: npm run test:e2e

  chrome-extension:
    name: Chrome extension / MV3
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples/chrome-extension-pilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/chrome-extension-pilot/package-lock.json
      - run: npm install --global npm@11.12.1
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - name: Load unpacked MV3 in persistent Chromium
        run: npm run test:e2e
      - name: Package and inspect validation ZIP
        run: npm run package && unzip -l artifacts/focus-lens-v0.1.0.zip
      - uses: actions/upload-artifact@v4
        with:
          name: focus-lens-validation-zip
          path: examples/chrome-extension-pilot/artifacts/focus-lens-v0.1.0.zip
          if-no-files-found: error

  automation:
    name: Automation / Python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples/automation-pilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: examples/automation-pilot/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m compileall -q roster_report tests
      - run: python -m unittest discover -s tests -v
      - name: Dry-run writes nothing
        run: python -m roster_report fixtures/roster.csv output/report.json --dry-run && test ! -e output/report.json
      - name: Repeated execution is byte-identical
        run: |
          python -m roster_report fixtures/roster.csv output/report.json
          cp output/report.json output/first.json
          python -m roster_report fixtures/roster.csv output/report.json
          cmp output/first.json output/report.json
