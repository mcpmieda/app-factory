name: One-shot Field Test Semantic Patch

on:
  push:
    branches: ["feat/field-test-hardening"]
    paths:
      - ".github/workflows/field-test-patch-semantic-assurance.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/field-test-hardening

      - name: Apply exact engine patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("engine/semantic_assurance.py")
          text = path.read_text(encoding="utf-8")
          old = '''    if any(item.get("pattern") == "policy" for item in requirements):
              recommendations.append({"kind": "opa-or-cedar", "reason": "policy-oriented requirements may benefit from declarative policy-as-code"})
          '''
          new = '''    access_policy_signal = re.compile(
              r"\\b(authorization|authorisation|autorização|autorizacao|permission|permissão|permissao|"
              r"access control|controle de acesso|rbac|abac|role|roles|papel|papéis|papeis|tenant|"
              r"least privilege|menor privilégio|menor privilegio|escopo de acesso)\\b",
              re.I,
          )
          policy_requirements = [item for item in requirements if item.get("pattern") == "policy"]
          policy_texts: list[str] = []
          for item in policy_requirements:
              pieces: list[str] = []
              for key in ("component", "trigger", "timing"):
                  value = item.get(key)
                  if isinstance(value, str):
                      pieces.append(value)
              for key in ("scope", "preconditions", "response"):
                  value = item.get(key)
                  if isinstance(value, list):
                      pieces.extend(str(entry) for entry in value if isinstance(entry, str))
              policy_texts.append(" ".join(pieces))
          if any(access_policy_signal.search(text) for text in policy_texts):
              recommendations.append({
                  "kind": "opa-or-cedar",
                  "reason": "explicit authorization/access-control policy signals detected; policy-as-code may improve reviewability",
              })
          '''

          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one legacy policy recommendation block, found {text.count(old)}")

          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Commit engine patch
        run: |
          git diff --check
          git add engine/semantic_assurance.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: scope policy-as-code recommendations to access policy"
          git push origin HEAD:feat/field-test-hardening
