name: Validate Semantic Assurance

on:
  pull_request:
  push:
    branches:
      - main

# Temporary branch migration support. Reverted to contents: read before merge.
permissions:
  contents: write

jobs:
  semantic-assurance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply one-time field-test recommendation patch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile
          import re
          import textwrap

          path = Path("engine/semantic_assurance.py")
          text = path.read_text(encoding="utf-8")

          hardened_body = textwrap.dedent(r'''
          access_policy_signal = re.compile(
              r"\b(authorization|authorisation|autorização|autorizacao|permission|permissão|permissao|"
              r"access control|controle de acesso|rbac|abac|role|roles|papel|papéis|papeis|tenant|"
              r"least privilege|menor privilégio|menor privilegio|escopo de acesso)\b",
              re.I,
          )
          policy_requirements = [item for item in requirements if item.get("pattern") == "policy"]
          policy_texts: list[str] = []
          for item in policy_requirements:
              pieces: list[str] = []
              for key in ("component", "trigger", "timing"):
                  value = item.get(key)
                  if isinstance(value, str):
                      pieces.append(value)
              for key in ("scope", "preconditions", "response"):
                  value = item.get(key)
                  if isinstance(value, list):
                      pieces.extend(str(entry) for entry in value if isinstance(entry, str))
              policy_texts.append(" ".join(pieces))
          if any(access_policy_signal.search(value) for value in policy_texts):
              recommendations.append({
                  "kind": "opa-or-cedar",
                  "reason": "explicit authorization/access-control policy signals detected; policy-as-code may improve reviewability",
              })
          return recommendations
          ''').strip("\n")
          replacement = textwrap.indent(hardened_body, "    ") + "\n"

          hardened_or_malformed = re.compile(
              r'(?ms)^    access_policy_signal = re\.compile\(\n.*?^    return recommendations\n'
          )
          legacy = re.compile(
              r'(?m)^    if any\(item\.get\("pattern"\) == "policy" for item in requirements\):\n'
              r'        recommendations\.append\(\{"kind": "opa-or-cedar", "reason": "policy-oriented requirements may benefit from declarative policy-as-code"\}\)\n'
              r'    return recommendations\n'
          )

          if hardened_or_malformed.search(text):
              text, count = hardened_or_malformed.subn(lambda _: replacement, text)
          else:
              text, count = legacy.subn(lambda _: replacement, text)
          if count != 1:
              raise SystemExit(f"expected exactly one policy recommendation region, found {count}")

          path.write_text(text, encoding="utf-8")
          py_compile.compile(str(path), doraise=True)
          PY
          git diff --check
          if git diff --quiet -- engine/semantic_assurance.py; then
            echo "No engine commit needed."
          else
            git add engine/semantic_assurance.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "fix: scope policy-as-code recommendations to access policy"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Record field-test governance decisions
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          python - <<'PY'
          from pathlib import Path

          decisions_path = Path("docs/DECISIONS.md")
          decisions = decisions_path.read_text(encoding="utf-8")
          if "**D-071:**" not in decisions:
              anchor = "\nQuando uma decisão for substituída, registrar a nova decisão e marcar a anterior como superada; não apagar silenciosamente o histórico."
              block = '''
          - **D-071:** CLIs oficiais da Factory que importam módulos internos devem se auto-inicializar a partir do checkout limpo; workflows e usuários não devem depender de `PYTHONPATH` externo apenas para executar o CLI documentado.
          - **D-072:** projeto Node legado sem lockfile recebe estado explícito `legacy_lockfile_bootstrap`: instalação permissiva pode materializar um lockfile apenas como migração controlada; o lockfile deve ser validado/versionado antes de o CI final usar instalação congelada (`npm ci` ou equivalente). Ausência de lockfile nunca é tratada como instalação reproduzível.
          - **D-073:** `pattern: policy` em Semantic Assurance não seleciona OPA/Rego/Cedar por si só. Policy-as-code é recomendado somente quando existirem sinais materiais de autorização, permissões, papéis, controle de acesso ou política equivalente que se beneficie de engine declarativo.
          - **D-074:** validação de schema por registro e invariantes da coleção são camadas distintas. Unicidade, cardinalidade e outras regras entre registros devem ser verificadas no boundary/coleção apropriado e testadas nas entradas relevantes, não inferidas do schema de um item.
          - **D-075:** `local-app` com dados relevantes pode exigir contrato versionado de storage, migração e backup/recovery proporcional sem virar `persistent-app` ou ganhar backend artificial. Hospedagem pública não altera por si só a classificação nem a fonte autoritativa dos dados.
          - **D-076:** E2E em UI densa/hidratada deve escopar locators à região/formulário correto e sincronizar com a hidratação antes de semear, limpar ou inspecionar persistência; corrida do setup de teste não pode ser mascarada como defeito do produto.
          '''.strip("\n")
              if anchor not in decisions:
                  raise SystemExit("DECISIONS final anchor not found")
              decisions_path.write_text(decisions.replace(anchor, "\n" + block + anchor), encoding="utf-8")

          state_path = Path("PROJECT_STATE.md")
          state = state_path.read_text(encoding="utf-8")
          state_marker = "- Semantic Assurance engine: `engine/semantic_assurance.py` valida IDs/referências, cardinalidades/ranges/enums, dependências conflitantes, perguntas `blocking`, cobertura requisito→AC/invariante→gate e recomenda formalização proporcional sem transformar análise probabilística em prova;"
          state_insert = "- field-test hardening (Gestão de Alunos): CLI Semantic Assurance auto-inicializável, bootstrap explícito para legado sem lockfile, policy-as-code apenas com sinal de acesso, invariantes entre registros, lifecycle versionado para dados locais e disciplina de E2E com hidratação/escopo;"
          if state_insert not in state:
              if state_marker not in state:
                  raise SystemExit("PROJECT_STATE semantic engine marker not found")
              state_path.write_text(state.replace(state_marker, state_marker + "\n" + state_insert), encoding="utf-8")

          core_path = Path("core/SEMANTIC_ASSURANCE.md")
          core = core_path.read_text(encoding="utf-8")
          core_anchor = "Considere **OPA/Rego** ou **Cedar** para policies complexas separadas da implementação."
          core_rule = "`pattern: policy` sozinho não seleciona policy-as-code. Exija sinais materiais de autorização, permissões, papéis ou controle de acesso antes de recomendar OPA/Rego/Cedar."
          if core_rule not in core:
              if core_anchor not in core:
                  raise SystemExit("Semantic Assurance policy anchor not found")
              core_path.write_text(core.replace(core_anchor, core_anchor + "\n\n" + core_rule), encoding="utf-8")
          PY
          git diff --check
          if git diff --quiet -- docs/DECISIONS.md PROJECT_STATE.md core/SEMANTIC_ASSURANCE.md; then
            echo "Governance decisions already recorded."
          else
            git add docs/DECISIONS.md PROJECT_STATE.md core/SEMANTIC_ASSURANCE.md
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs: record field-test hardening decisions"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Compile Semantic Assurance engine
        run: python -m py_compile engine/semantic_assurance.py scripts/semantic_assurance.py scripts/validate_semantic_assurance.py
      - name: Validate Factory structure
        run: python scripts/validate_factory.py
      - name: Validate Semantic Assurance
        run: python scripts/validate_semantic_assurance.py
