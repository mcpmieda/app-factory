name: Dispatch durable takeover proof

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: >-
      github.actor == github.repository_owner &&
      github.event.issue.number == 72 &&
      github.event.comment.body == '/run-takeover-proof'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch trusted main workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run live-durable-takeover-proof.yml \
            --repo "${REPOSITORY}" \
            --ref main
