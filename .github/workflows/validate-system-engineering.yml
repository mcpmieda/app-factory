name: Validate System Engineering Contract

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "templates/project/AGENTS.md"
      - "core/SYSTEM_ENGINEERING.md"
      - "core/ENTRYPOINT.md"
      - "core/PROJECT_SCALE.md"
      - "core/WORKFLOW.md"
      - "core/DEFINITION_OF_DONE.md"
      - "skills/factory-router/SKILL.md"
      - "skills/app-planner/SKILL.md"
      - "profiles/web-app/PROFILE.md"
      - "scripts/validate_system_engineering.py"
      - ".github/workflows/validate-system-engineering.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  system-engineering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile validator
        run: python -m py_compile scripts/validate_system_engineering.py
      - name: Validate architecture contract wiring
        run: python scripts/validate_system_engineering.py
