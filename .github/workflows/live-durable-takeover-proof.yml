name: Live durable cross-executor takeover proof

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: live-durable-takeover-proof
  cancel-in-progress: false

jobs:
  executor-a:
    name: Issue Lease A on executor A
    if: github.actor == github.repository_owner && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      ISSUE_NUMBER: '72'
      WORKER_A: takeover-executor-a
      WORKER_B: takeover-executor-b
    steps:
      - name: Checkout trusted Factory main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Build immutable proof request and Lease A
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          proof_dir="${RUNNER_TEMP}/takeover-proof"
          mkdir -p "${proof_dir}"
          export PROOF_DIR="${proof_dir}"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from engine.durable_provider_agent import (
              FactoryLease,
              TRUSTED_CONTROL_ACTOR,
              encode_marker,
              manifest_fingerprint,
              new_lease_times,
              request_fingerprint,
          )
          from engine.provider_runtime import ProviderTaskRequest

          root = Path(os.environ['PROOF_DIR'])
          manifest = {
              'schema_version': 1,
              'run_id': 'durable-takeover-proof-001',
              'goal': 'Prove cross-executor recovery after lease expiry.',
              'max_parallel': 1,
              'tasks': [
                  {
                      'id': 'lease-handoff',
                      'paths': ['pilots/live/durable-takeover/result.md'],
                  }
              ],
          }
          request_payload = {
              'run_id': 'durable-takeover-proof-001',
              'task_id': 'lease-handoff',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'worktree': os.environ['GITHUB_WORKSPACE'],
              'integration_branch': 'factory/durable-takeover-proof-001',
              'target_branch': 'main',
              'working_branch': 'factory/durable-takeover-proof-001/lease-handoff',
              'paths': ['pilots/live/durable-takeover/result.md'],
              'instruction': 'Lease-only recovery proof. Do not execute a provider model.',
              'allowed_commands': [],
              'timeout_seconds': 900,
              'remote': 'origin',
          }
          request = ProviderTaskRequest.from_mapping(request_payload)
          issued_at, expires_at = new_lease_times(ttl_seconds=180)
          lease = FactoryLease(
              lease_id=f"takeover-a-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}",
              run_id=request.run_id,
              task_id=request.task_id,
              issue_number=int(os.environ['ISSUE_NUMBER']),
              provider_id='opencode_ollama',
              worker_id=os.environ['WORKER_A'],
              repository=request.repository,
              working_branch=request.working_branch,
              integration_branch=request.integration_branch,
              target_branch=request.target_branch,
              request_sha256=request_fingerprint(request),
              manifest_sha256=manifest_fingerprint(manifest),
              issued_at=issued_at,
              expires_at=expires_at,
              actor=TRUSTED_CONTROL_ACTOR,
          )
          lease.validate()
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          (root / 'request.json').write_text(json.dumps(request_payload, indent=2) + '\n', encoding='utf-8')
          (root / 'lease-a.json').write_text(json.dumps(lease.to_dict(), indent=2) + '\n', encoding='utf-8')
          (root / 'lease-a-comment.txt').write_text(
              encode_marker('lease', lease.to_dict())
              + '\nCross-executor proof Lease A issued by GitHub Actions. Heartbeats never extend this expiry.\n',
              encoding='utf-8',
          )
          PY

          python scripts/durable_provider_agent.py fingerprint \
            "${proof_dir}/request.json" "${proof_dir}/manifest.json" \
            > "${proof_dir}/fingerprints-a.json"

          python scripts/durable_provider_agent.py validate \
            "${proof_dir}/request.json" "${proof_dir}/manifest.json" "${proof_dir}/lease-a.json" \
            --worker-id "${WORKER_A}" \
            > "${proof_dir}/authorized-a.json"

          if python scripts/durable_provider_agent.py validate \
            "${proof_dir}/request.json" "${proof_dir}/manifest.json" "${proof_dir}/lease-a.json" \
            --worker-id "${WORKER_B}" \
            > "${proof_dir}/unexpected-b.json" 2>&1; then
            echo 'Executor B was incorrectly authorized while Lease A was active.' >&2
            exit 1
          fi

          lease_hash_before=$(sha256sum "${proof_dir}/lease-a.json" | awk '{print $1}')
          python scripts/durable_provider_agent.py heartbeat \
            "${proof_dir}/lease-a.json" \
            --phase running \
            --detail 'executor A alive; expiry intentionally unchanged' \
            --metric progress=0.25 \
            > "${proof_dir}/heartbeat-a.json"
          lease_hash_after=$(sha256sum "${proof_dir}/lease-a.json" | awk '{print $1}')
          test "${lease_hash_before}" = "${lease_hash_after}"

          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body="$(cat "${proof_dir}/lease-a-comment.txt")" \
            >/dev/null

          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from engine.durable_provider_agent import encode_marker

          root = Path(os.environ['PROOF_DIR'])
          heartbeat = json.loads((root / 'heartbeat-a.json').read_text(encoding='utf-8'))['heartbeat']
          (root / 'heartbeat-comment.txt').write_text(
              encode_marker('heartbeat', heartbeat)
              + '\nLease A heartbeat persisted by GitHub Actions without renewing authority.\n',
              encoding='utf-8',
          )
          PY

          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body="$(cat "${proof_dir}/heartbeat-comment.txt")" \
            >/dev/null

  executor-b:
    name: Expire Lease A and take over on executor B
    needs: [executor-a]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      ISSUE_NUMBER: '72'
      WORKER_A: takeover-executor-a
      WORKER_B: takeover-executor-b
    steps:
      - name: Checkout trusted Factory main on a separate runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Recover durable state and perform takeover
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          proof_dir="${RUNNER_TEMP}/takeover-proof"
          mkdir -p "${proof_dir}"
          export PROOF_DIR="${proof_dir}"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['PROOF_DIR'])
          manifest = {
              'schema_version': 1,
              'run_id': 'durable-takeover-proof-001',
              'goal': 'Prove cross-executor recovery after lease expiry.',
              'max_parallel': 1,
              'tasks': [
                  {
                      'id': 'lease-handoff',
                      'paths': ['pilots/live/durable-takeover/result.md'],
                  }
              ],
          }
          request_payload = {
              'run_id': 'durable-takeover-proof-001',
              'task_id': 'lease-handoff',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'worktree': os.environ['GITHUB_WORKSPACE'],
              'integration_branch': 'factory/durable-takeover-proof-001',
              'target_branch': 'main',
              'working_branch': 'factory/durable-takeover-proof-001/lease-handoff',
              'paths': ['pilots/live/durable-takeover/result.md'],
              'instruction': 'Lease-only recovery proof. Do not execute a provider model.',
              'allowed_commands': [],
              'timeout_seconds': 900,
              'remote': 'origin',
          }
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          (root / 'request.json').write_text(json.dumps(request_payload, indent=2) + '\n', encoding='utf-8')
          PY

          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" \
            > "${proof_dir}/comments.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from engine.durable_provider_agent import FactoryLease, decode_marker

          root = Path(os.environ['PROOF_DIR'])
          comments = json.loads((root / 'comments.json').read_text(encoding='utf-8'))
          lease = None
          for comment in reversed(comments):
              if comment.get('user', {}).get('login') != 'github-actions[bot]':
                  continue
              try:
                  payload = decode_marker(comment.get('body', ''), 'lease')
              except ValueError:
                  continue
              candidate = FactoryLease.from_mapping(payload)
              if candidate.run_id == 'durable-takeover-proof-001' and candidate.worker_id == os.environ['WORKER_A']:
                  lease = candidate
                  break
          if lease is None:
              raise SystemExit('Trusted Lease A was not recoverable from GitHub issue comments.')
          (root / 'lease-a.json').write_text(json.dumps(lease.to_dict(), indent=2) + '\n', encoding='utf-8')
          PY

          python scripts/durable_provider_agent.py fingerprint \
            "${proof_dir}/request.json" "${proof_dir}/manifest.json" \
            > "${proof_dir}/fingerprints-b.json"

          # A must still be active when the distinct runner B starts, otherwise the proof is inconclusive.
          python scripts/durable_provider_agent.py validate \
            "${proof_dir}/request.json" "${proof_dir}/manifest.json" "${proof_dir}/lease-a.json" \
            --worker-id "${WORKER_A}" \
            > "${proof_dir}/lease-a-still-active.json"

          if python scripts/durable_provider_agent.py validate \
            "${proof_dir}/request.json" "${proof_dir}/manifest.json" "${proof_dir}/lease-a.json" \
            --worker-id "${WORKER_B}" \
            > "${proof_dir}/unexpected-b-active.json" 2>&1; then
            echo 'Executor B was incorrectly authorized before Lease A expired.' >&2
            exit 1
          fi

          sleep_seconds=$(python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from engine.durable_provider_agent import parse_timestamp

          lease = json.loads(Path(os.environ['PROOF_DIR'], 'lease-a.json').read_text(encoding='utf-8'))
          expires = parse_timestamp(lease['expires_at'], label='Lease A expiry')
          remaining = int((expires - datetime.now(timezone.utc)).total_seconds()) + 2
          print(max(0, remaining))
          PY
          )
          if [ "${sleep_seconds}" -gt 0 ]; then
            sleep "${sleep_seconds}"
          fi

          if python scripts/durable_provider_agent.py validate \
            "${proof_dir}/request.json" "${proof_dir}/manifest.json" "${proof_dir}/lease-a.json" \
            --worker-id "${WORKER_A}" \
            > "${proof_dir}/unexpected-a-after-expiry.json" 2>&1; then
            echo 'Expired Lease A incorrectly remained authoritative.' >&2
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from engine.durable_provider_agent import (
              FactoryLease,
              TRUSTED_CONTROL_ACTOR,
              encode_marker,
              manifest_fingerprint,
              new_lease_times,
              request_fingerprint,
          )
          from engine.provider_runtime import ProviderTaskRequest

          root = Path(os.environ['PROOF_DIR'])
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          request = ProviderTaskRequest.from_mapping(
              json.loads((root / 'request.json').read_text(encoding='utf-8'))
          )
          lease_a = FactoryLease.from_mapping(
              json.loads((root / 'lease-a.json').read_text(encoding='utf-8'))
          )
          issued_at, expires_at = new_lease_times(ttl_seconds=600)
          lease_b = FactoryLease(
              lease_id=f"takeover-b-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}",
              run_id=request.run_id,
              task_id=request.task_id,
              issue_number=int(os.environ['ISSUE_NUMBER']),
              provider_id=lease_a.provider_id,
              worker_id=os.environ['WORKER_B'],
              repository=request.repository,
              working_branch=request.working_branch,
              integration_branch=request.integration_branch,
              target_branch=request.target_branch,
              request_sha256=request_fingerprint(request),
              manifest_sha256=manifest_fingerprint(manifest),
              issued_at=issued_at,
              expires_at=expires_at,
              actor=TRUSTED_CONTROL_ACTOR,
          )
          lease_b.validate()
          if lease_b.request_sha256 != lease_a.request_sha256:
              raise SystemExit('Request fingerprint changed between executors.')
          if lease_b.manifest_sha256 != lease_a.manifest_sha256:
              raise SystemExit('Manifest fingerprint changed between executors.')
          (root / 'lease-b.json').write_text(json.dumps(lease_b.to_dict(), indent=2) + '\n', encoding='utf-8')
          (root / 'lease-b-comment.txt').write_text(
              encode_marker('lease', lease_b.to_dict())
              + '\nLease B issued only after trusted Lease A expired; authority moved to executor B.\n',
              encoding='utf-8',
          )
          PY

          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body="$(cat "${proof_dir}/lease-b-comment.txt")" \
            >/dev/null

          python scripts/durable_provider_agent.py validate \
            "${proof_dir}/request.json" "${proof_dir}/manifest.json" "${proof_dir}/lease-b.json" \
            --worker-id "${WORKER_B}" \
            > "${proof_dir}/authorized-b.json"

          if python scripts/durable_provider_agent.py validate \
            "${proof_dir}/request.json" "${proof_dir}/manifest.json" "${proof_dir}/lease-b.json" \
            --worker-id "${WORKER_A}" \
            > "${proof_dir}/unexpected-a-on-b.json" 2>&1; then
            echo 'Executor A was incorrectly authorized by Lease B.' >&2
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['PROOF_DIR'])
          a = json.loads((root / 'lease-a.json').read_text(encoding='utf-8'))
          b = json.loads((root / 'lease-b.json').read_text(encoding='utf-8'))
          proof = {
              'schema_version': 1,
              'run_id': 'durable-takeover-proof-001',
              'issue_number': int(os.environ['ISSUE_NUMBER']),
              'executor_a': os.environ['WORKER_A'],
              'executor_b': os.environ['WORKER_B'],
              'lease_a': a['lease_id'],
              'lease_a_expires_at': a['expires_at'],
              'lease_b': b['lease_id'],
              'request_sha256': b['request_sha256'],
              'manifest_sha256': b['manifest_sha256'],
              'takeover': 'proved',
              'production_activation': 'not-performed',
              'target_merge': 'not-performed',
          }
          compact = json.dumps(proof, separators=(',', ':'), sort_keys=True)
          (root / 'proof-comment.txt').write_text(
              f'<!-- FACTORY_DURABLE_TAKEOVER_PROOF {compact} -->\n'
              'Cross-executor lease takeover proved by two GitHub-hosted jobs. Heartbeat did not renew Lease A; executor B received authority only after expiry.\n',
              encoding='utf-8',
          )
          PY

          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body="$(cat "${proof_dir}/proof-comment.txt")" \
            >/dev/null
