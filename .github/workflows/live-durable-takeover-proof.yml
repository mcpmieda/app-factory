name: Live durable cross-executor takeover proof

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: live-durable-takeover-proof
  cancel-in-progress: false

jobs:
  executor-a:
    name: Issue Lease A on executor A
    if: >-
      github.actor == github.repository_owner &&
      github.event.issue.number == 72 &&
      github.event.comment.body == '/run-takeover-proof'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      ISSUE_NUMBER: '72'
    steps:
      - name: Checkout trusted Factory main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Build and validate Lease A
        shell: bash
        run: |
          set -euo pipefail
          python scripts/durable_takeover_proof.py phase-a --output "${RUNNER_TEMP}/takeover-proof"

      - name: Persist trusted Lease A and heartbeat
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body="$(cat "${RUNNER_TEMP}/takeover-proof/lease-a-comment.txt")" \
            >/dev/null
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body="$(cat "${RUNNER_TEMP}/takeover-proof/heartbeat-comment.txt")" \
            >/dev/null

  executor-b:
    name: Expire Lease A and take over on executor B
    needs: [executor-a]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      ISSUE_NUMBER: '72'
    steps:
      - name: Checkout trusted Factory main on a distinct runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Recover durable GitHub state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" \
            > "${RUNNER_TEMP}/takeover-comments.json"

      - name: Prove expiry and executor B takeover
        shell: bash
        run: |
          set -euo pipefail
          python scripts/durable_takeover_proof.py phase-b \
            --comments "${RUNNER_TEMP}/takeover-comments.json" \
            --output "${RUNNER_TEMP}/takeover-proof"

      - name: Persist trusted Lease B and proof
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body="$(cat "${RUNNER_TEMP}/takeover-proof/lease-b-comment.txt")" \
            >/dev/null
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body="$(cat "${RUNNER_TEMP}/takeover-proof/proof-comment.txt")" \
            >/dev/null
