name: Validate V1 Release Candidate

on:
  pull_request:
    paths:
      - ".github/workflows/validate-v1-release.yml"
      - "scripts/validate_v1_*.py"
      - "audits/v1-final/equipment-loans/**"
      - "research/V1.0_FINAL_AUDIT.md"
      - "research/evidence/v1-final-*"
      - ".codex-plugin/plugin.json"
      - ".agents/plugins/marketplace.json"
      - "docs/CODEX_PLUGIN.md"
      - "README.md"
      - "CHANGELOG.md"
      - "PROJECT_STATE.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Use pinned npm version
        run: npm install --global npm@10.9.9 && npm --version
      - name: Compose existing Core, Skills and plugin validators
        run: |
          python scripts/validate_factory.py
          python scripts/validate_skills.py
          python scripts/validate_plugin.py
      - name: Install plugin in isolated Codex home
        run: python scripts/validate_v1_bootstrap.py
      - name: Validate V1 composition and repository hygiene
        run: python scripts/validate_v1_release.py

  equipment-loans:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: audits/v1-final/equipment-loans
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: audits/v1-final/equipment-loans/package-lock.json
      - name: Use pinned npm version
        run: npm install --global npm@10.9.9 && npm --version
      - name: Clean install and local migration
        run: npm ci && npm run setup
      - name: Static quality and tests
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm run test:coverage
          npm run db:check
      - name: Production build and dependency gate
        run: npm run build && npm audit --audit-level=high
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Loan, reload, return, impossible state, overdue, mobile and reduced motion
        run: npm run e2e
