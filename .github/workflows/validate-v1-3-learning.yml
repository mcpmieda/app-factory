name: Validate V1.3 Learning Engine

on:
  pull_request:
    paths:
      - "engine/**"
      - "scripts/factory.py"
      - "scripts/validate_factory.py"
      - "scripts/validate_v1_1.py"
      - "scripts/validate_v1_2.py"
      - "scripts/validate_v1_3.py"
      - "tests/v1_3/**"
      - "core/LEARNING_ENGINE.md"
      - "core/EXECUTION_FABRIC.md"
      - "core/TASK_ROUTER.md"
      - "skills/learning-engine/**"
      - "skills/execution-router/**"
      - "skills/tool-router/**"
      - ".gitignore"
      - "starters/web-admin/template/.gitignore"
      - ".github/workflows/validate-v1-3-learning.yml"
  push:
    branches: [main]
    paths:
      - "engine/**"
      - "scripts/factory.py"
      - "scripts/validate_factory.py"
      - "scripts/validate_v1_3.py"
      - "tests/v1_3/**"
      - "core/LEARNING_ENGINE.md"
      - "skills/learning-engine/**"
      - ".github/workflows/validate-v1-3-learning.yml"

permissions:
  contents: read

jobs:
  learning-engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Structural Factory validation
        run: python scripts/validate_factory.py
      - name: V1.1 autonomy regression
        run: python scripts/validate_v1_1.py
      - name: V1.2 Execution Fabric regression
        run: python scripts/validate_v1_2.py
      - name: V1.3 Learning Engine validation
        run: python scripts/validate_v1_3.py
      - name: Fresh-session local-learning smoke
        run: |
          project="$(mktemp -d)"
          printf '%s\n' 'Temporary learning smoke project.' > "$project/README.md"
          python scripts/factory.py --root "$project" record-execution verify github_ci success --duration-ms 321 > /tmp/learning-record.json
          python scripts/factory.py --root "$project" learning-status > /tmp/learning-status.json
          python scripts/factory.py --root "$project" --backends github_ci,sandbox learning-recommend verify > /tmp/learning-recommend.json
          python - <<'PY'
          import json
          record = json.load(open('/tmp/learning-record.json', encoding='utf-8'))
          status = json.load(open('/tmp/learning-status.json', encoding='utf-8'))
          recommendation = json.load(open('/tmp/learning-recommend.json', encoding='utf-8'))
          assert record['learning']['events'] == 1
          assert status['events'] == 1
          assert status['local_only'] is True
          assert status['external_telemetry'] is False
          assert recommendation['route']['backend'] == 'github_ci'
          assert recommendation['learning']['mode'] == 'insufficient-data'
          print('OK: fresh session recovered local learning and kept baseline with insufficient data.')
          PY
