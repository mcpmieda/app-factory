name: Validate Independent Verification

on:
  pull_request:
    paths:
      - "core/**"
      - "engine/**"
      - "skills/**"
      - "templates/**"
      - "scripts/**"
      - "profiles/**"
      - "AGENTS.md"
      - "PROJECT_STATE.md"
      - "README.md"
      - "APP_FACTORY_PLAN.md"
      - "docs/**"
      - ".codex-plugin/**"
      - ".github/workflows/validate-independent-verification.yml"
  push:
    branches: [main]
    paths:
      - "core/**"
      - "engine/**"
      - "skills/**"
      - "templates/**"
      - "scripts/**"
      - "profiles/**"
      - "AGENTS.md"
      - "PROJECT_STATE.md"
      - "README.md"
      - "APP_FACTORY_PLAN.md"
      - "docs/**"
      - ".codex-plugin/**"
      - ".github/workflows/validate-independent-verification.yml"

permissions:
  contents: read

concurrency:
  group: independent-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile deterministic planner and validator
        run: python -m py_compile engine/independent_verification.py scripts/validate_independent_verification.py
      - name: Validate Factory structure
        run: python scripts/validate_factory.py
      - name: Validate Independent Verification planning and wiring
        run: python scripts/validate_independent_verification.py
