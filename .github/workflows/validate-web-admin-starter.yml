name: Validate Web Admin Starter

on:
  pull_request:
    paths:
      - ".github/workflows/validate-web-admin-starter.yml"
      - "scripts/create-web-admin.mjs"
      - "scripts/create-web-admin.test.mjs"
      - "starters/web-admin/**"
      - "examples/asset-admin/**"
      - "profiles/web-admin/PROFILE.md"
      - "research/V0.6_WEB_ADMIN_HARDENING.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-web-admin-starter.yml"
      - "scripts/create-web-admin.mjs"
      - "scripts/create-web-admin.test.mjs"
      - "starters/web-admin/**"
      - "examples/asset-admin/**"
      - "profiles/web-admin/PROFILE.md"
      - "research/V0.6_WEB_ADMIN_HARDENING.md"

permissions:
  contents: read

jobs:
  generated-starter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: starters/web-admin/template/package-lock.json
      - name: Use pinned npm version
        run: npm install --global npm@10.9.9 && npm --version
      - name: Test generator safety and personalization
        run: node --test scripts/create-web-admin.test.mjs
      - name: Generate a clean temporary project
        run: node scripts/create-web-admin.mjs "$RUNNER_TEMP/generated-web-admin" "CI Generated Admin"
      - name: Install generated project dependencies
        working-directory: ${{ runner.temp }}/generated-web-admin
        run: npm ci
      - name: Check generated project without prior build artifacts
        working-directory: ${{ runner.temp }}/generated-web-admin
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm run test:coverage
          npm run build
          npm audit --audit-level=high

  generated-sqlite-recipes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: database-only
            arguments: --recipe database-drizzle
            auth: false
          - case: auth-with-implicit-database
            arguments: --recipe auth-better-auth
            auth: true
          - case: explicit-database-and-auth
            arguments: --recipe database-drizzle --recipe auth-better-auth
            auth: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use pinned npm version
        run: npm install --global npm@10.9.9 && npm --version
      - name: Generate recipe case
        run: node scripts/create-web-admin.mjs "$RUNNER_TEMP/${{ matrix.case }}" "${{ matrix.case }}" ${{ matrix.arguments }}
      - name: Install generated project dependencies
        working-directory: ${{ runner.temp }}/${{ matrix.case }}
        run: npm ci
      - name: Apply migrations and idempotent seed
        working-directory: ${{ runner.temp }}/${{ matrix.case }}
        run: |
          npm run setup
          npm run setup
          npm run db:check
      - name: Verify Better Auth schema contract
        if: matrix.auth
        working-directory: ${{ runner.temp }}/${{ matrix.case }}
        run: npm run auth:schema:check
      - name: Check generated recipe project
        working-directory: ${{ runner.temp }}/${{ matrix.case }}
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm run test:coverage
          npm run build
          npm audit --audit-level=high

  generated-postgres-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://app:app@127.0.0.1:5432/app
      BETTER_AUTH_URL: http://127.0.0.1:3200
      BETTER_AUTH_SECRET: factory-ci-secret-with-at-least-32-characters
      SEED_ADMIN_NAME: CI Admin
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: ci-admin-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use pinned npm version
        run: npm install --global npm@10.9.9 && npm --version
      - name: Generate PostgreSQL and Better Auth project
        run: >-
          node scripts/create-web-admin.mjs
          "$RUNNER_TEMP/generated-postgres-auth"
          "CI PostgreSQL Admin"
          --recipe database-drizzle-postgres
          --recipe auth-better-auth
      - name: Install generated project dependencies
        working-directory: ${{ runner.temp }}/generated-postgres-auth
        run: npm ci
      - name: Reject accidental SQLite provider dependencies
        working-directory: ${{ runner.temp }}/generated-postgres-auth
        run: >-
          node -e "const p=require('./package.json');
          const all={...p.dependencies,...p.devDependencies};
          if(all['better-sqlite3']||all['@types/better-sqlite3']) process.exit(1);
          if(!all.postgres) process.exit(1);"
      - name: Apply migrations and idempotent seed twice
        working-directory: ${{ runner.temp }}/generated-postgres-auth
        run: |
          npm run setup
          npm run setup
      - name: Exercise real PostgreSQL persistence and auth session
        working-directory: ${{ runner.temp }}/generated-postgres-auth
        run: |
          npm run db:smoke
          npm run auth:smoke
          npm run auth:schema:check
          npm run db:check
      - name: Check and build PostgreSQL project
        working-directory: ${{ runner.temp }}/generated-postgres-auth
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm run test:coverage
          npm run build
          npm run start:smoke
          npm audit --audit-level=high

  asset-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: examples/asset-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/asset-admin/package-lock.json
      - name: Use pinned npm version
        run: npm install --global npm@10.9.9 && npm --version
      - name: Install dependencies
        run: npm ci
      - name: Setup migrations and fictitious seed
        run: npm run setup
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck without prior build artifacts
        run: npm run typecheck
      - name: Unit tests with coverage
        run: npm run test:coverage
      - name: Production build
        run: npm run build
      - name: Reject high or critical dependency advisories
        run: npm audit --audit-level=high
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end desktop and mobile
        run: npm run e2e
