name: Validate Agent Conformance

on:
  pull_request:
    paths:
      - "core/**"
      - "engine/**"
      - "skills/**"
      - "scripts/**"
      - "tests/**"
      - "evals/agent-conformance/**"
      - "research/EVALUATION_EVIDENCE_RESEARCH.md"
      - ".github/workflows/validate-agent-conformance.yml"
  push:
    branches: [main]
    paths:
      - "core/**"
      - "engine/**"
      - "skills/**"
      - "scripts/**"
      - "evals/agent-conformance/**"
      - ".github/workflows/validate-agent-conformance.yml"

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compile harness
        run: python -m py_compile scripts/agent_conformance.py scripts/validate_agent_conformance.py
      - name: Audit corpus, negative scorers and reference solutions
        run: python scripts/validate_agent_conformance.py
