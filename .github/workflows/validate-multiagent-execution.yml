name: Validate Multiagent Execution

on:
  pull_request:
    paths:
      - "engine/work_orchestrator.py"
      - "engine/provider_runtime.py"
      - "engine/durable_provider_agent.py"
      - "engine/providers/**"
      - "engine/merge_train.py"
      - "scripts/factory_run.py"
      - "scripts/provider_worker.py"
      - "scripts/durable_provider_agent.py"
      - "scripts/validate_multiagent.py"
      - "tests/multiagent/**"
      - "core/MULTIAGENT_EXECUTION.md"
      - "core/PROVIDER_RUNTIME.md"
      - "core/DURABLE_PROVIDER_AGENT.md"
      - "core/MERGE_TRAIN.md"
      - "docs/MULTIAGENT_IMPLEMENTATION_STATUS.md"
      - "docs/JULES_API_FIRST_PILOT_EVIDENCE.md"
      - ".github/workflows/live-antigravity-pilot.yml"
      - ".github/workflows/live-opencode-ollama-pilot.yml"
      - ".github/workflows/validate-multiagent-execution.yml"
  push:
    branches: [main]
    paths:
      - "engine/work_orchestrator.py"
      - "engine/provider_runtime.py"
      - "engine/durable_provider_agent.py"
      - "engine/providers/**"
      - "engine/merge_train.py"
      - "scripts/factory_run.py"
      - "scripts/provider_worker.py"
      - "scripts/durable_provider_agent.py"
      - "scripts/validate_multiagent.py"
      - "tests/multiagent/**"
      - "core/MULTIAGENT_EXECUTION.md"
      - "core/PROVIDER_RUNTIME.md"
      - "core/DURABLE_PROVIDER_AGENT.md"
      - "core/MERGE_TRAIN.md"
      - "docs/MULTIAGENT_IMPLEMENTATION_STATUS.md"
      - "docs/JULES_API_FIRST_PILOT_EVIDENCE.md"
      - ".github/workflows/live-antigravity-pilot.yml"
      - ".github/workflows/live-opencode-ollama-pilot.yml"
      - ".github/workflows/validate-multiagent-execution.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multiagent-execution:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile multiagent engine and CLIs
        run: >-
          python -m py_compile
          engine/work_orchestrator.py
          engine/provider_runtime.py
          engine/durable_provider_agent.py
          engine/providers/antigravity.py
          engine/providers/opencode_ollama.py
          engine/merge_train.py
          scripts/factory_run.py
          scripts/provider_worker.py
          scripts/durable_provider_agent.py
          scripts/validate_multiagent.py
      - name: Structural Factory regression
        run: python scripts/validate_factory.py
      - name: Execution Fabric regression
        run: python scripts/validate_v1_2.py
      - name: Multiagent execution validation
        run: python scripts/validate_multiagent.py
      - name: Show provider-neutral registry
        run: python scripts/factory_run.py providers
