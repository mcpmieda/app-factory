name: Validate Web Admin Pilot

on:
  pull_request:
    paths:
      - "pilots/web-admin/**"
      - "research/V0.3_WEB_ADMIN_PILOT.md"
      - ".github/workflows/validate-web-admin-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "true"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pilots/web-admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pilots/web-admin/package-lock.json

      - name: Use pinned npm version
        run: npm install --global npm@10.9.9 && npm --version

      - name: Install dependencies
        run: npm ci

      - name: Setup local database and seed
        run: npm run setup

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Production build
        run: npm run build

      - name: Reject high or critical dependency advisories
        run: npm audit --audit-level=high

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e
